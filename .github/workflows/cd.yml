name: CD – Deploy to GKE

on:
  push:
    branches: [main]              # → staging
  release:
    types: [published]            # → production (requires GitHub Environment approval)
  workflow_dispatch:              # Enables manual trigger so it appears immediately

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false       # Never cancel a running deploy

env:
  GCP_PROJECT:   profile-123456789
  GCP_REGION:    us-central1-a
  GKE_CLUSTER:   portfolio-pool
  REGISTRY:      us-central1-docker.pkg.dev
  IMAGE:         us-central1-docker.pkg.dev/profile-123456789/portfolio/portfolio-app

jobs:

  # ─────────────────────────────────────────────────
  # 1. Build, tag, push Docker image to Artifact Registry
  # ─────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ env.IMAGE }}:${{ github.sha }}

    permissions:
      contents: read
      id-token: write              # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build JAR
        run: chmod +x gradlew && ./gradlew bootJar --no-daemon -x test

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: portfolio-cicd@profile-123456789.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────
  # 2. Deploy to STAGING (on push to main)
  # ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging.portfolio.example.com

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: portfolio-cicd@profile-123456789.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GCP_REGION }}

      - name: Create staging namespaces
        run: |
          kubectl create namespace portfolio-staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace kafka            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Strimzi Kafka Operator and Wait for CRDs
        run: |
          kubectl apply -f https://strimzi.io/install/latest?namespace=kafka -n kafka

          echo "Waiting for Strimzi CRDs to be established..."
          kubectl wait --for=condition=established --timeout=120s crd/kafkas.kafka.strimzi.io
          kubectl wait --for=condition=established --timeout=120s crd/kafkatopics.kafka.strimzi.io
          kubectl wait --for=condition=established --timeout=120s crd/kafkanodepools.kafka.strimzi.io

          echo "Refreshing kubectl discovery cache..."
          kubectl api-resources --api-group=kafka.strimzi.io

      - name: Apply Kafka manifests (idempotent)
        run: |
          kubectl apply --validate=false -f k8s/kafka/kafka-cluster.yaml

      - name: Create/update DB password secret
        run: |
          kubectl create secret generic portfolio-secrets \
            --from-literal=db-password=${{ secrets.DB_PASSWORD }} \
            --namespace portfolio-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Kustomize (staging)
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            us-central1-docker.pkg.dev/profile-123456789/portfolio/portfolio-app=${{ env.IMAGE }}:${{ github.sha }}
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/portfolio-pool \
            --namespace portfolio-staging \
            --timeout=5m

      - name: Smoke test staging
        run: |
          STAGING_IP=$(kubectl get svc portfolio-service -n portfolio-staging \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$STAGING_IP" ]; then
            curl --fail --retry 5 --retry-delay 10 \
              "http://$STAGING_IP/actuator/health" | jq .
          else
            echo "No external IP yet (ClusterIP mode) – skipping external smoke test"
          fi

  # ─────────────────────────────────────────────────
  # 3. Deploy to PRODUCTION (on GitHub Release publish)
  # ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: production
      url: https://portfolio.example.com

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: portfolio-cicd@profile-123456789.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GCP_REGION }}

      - name: Create production namespace
        run: |
          kubectl create namespace portfolio-production --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update DB password secret
        run: |
          kubectl create secret generic portfolio-secrets \
            --from-literal=db-password=${{ secrets.DB_PASSWORD_PROD }} \
            --namespace portfolio-production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Kustomize (production)
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            us-central1-docker.pkg.dev/profile-123456789/portfolio/portfolio-app=${{ env.IMAGE }}:${{ github.sha }}
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/portfolio-pool \
            --namespace portfolio-production \
            --timeout=10m

      - name: Production health check
        run: |
          PROD_IP=$(kubectl get svc portfolio-service -n portfolio-production \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$PROD_IP" ]; then
            curl --fail --retry 5 --retry-delay 15 \
              "http://$PROD_IP/actuator/health" | jq .
          fi

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "Deploy failed – rolling back production deployment"
          kubectl rollout undo deployment/portfolio-pool \
            --namespace portfolio-production