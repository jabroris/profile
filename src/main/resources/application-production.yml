spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:portfoliodb}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  h2:
    console:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:portfolio-kafka-bootstrap.kafka:9092}
    producer:
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        acks: all
        enable.idempotence: true
    consumer:
      properties:
        session.timeout.ms: 30000
        isolation.level: read_committed

logging:
  level:
    com.ivo.profile: INFO
    root: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
