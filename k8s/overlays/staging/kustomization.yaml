apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio-staging

resources:
  - ../../base

# Staging uses fewer replicas and lower resource limits
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: portfolio-pool
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: portfolio-hpa

configMapGenerator:
  - name: portfolio-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=staging

images:
  - name: us-central1-docker.pkg.dev/profile-123456789/portfolio/portfolio-pool
    newTag: latest    # overridden by CI/CD with the actual git SHA tag
