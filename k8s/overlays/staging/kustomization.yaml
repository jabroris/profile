apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio-staging

resources:
  - ../../base

# Staging patches for Deployment, HPA, and ConfigMap
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: portfolio-pool

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: portfolio-hpa

  # Override config values for staging using a strategic merge patch
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: portfolio-config
      data:
        SPRING_PROFILES_ACTIVE: "staging"
    target:
      kind: ConfigMap
      name: portfolio-config

images:
  - name: us-central1-docker.pkg.dev/profile-123456789/portfolio/portfolio-pool
