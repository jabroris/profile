---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio
  labels:
    app: portfolio-pool
spec:
  type: ClusterIP
  selector:
    app: portfolio-pool
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "portfolio-ssl-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: portfolio.example.com    # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 80
